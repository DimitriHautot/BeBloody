<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Default (light) theme-color, ahead of the script below so it can
         find and update this tag. Its `content` is then JS-managed rather
         than split into two static `media`-queried tags, because a plain
         `prefers-color-scheme` media query can't see the donor's explicit
         Clair/Sombre override (Paramètres > Thème) — only the actual OS
         preference. manifest.webmanifest keeps its own single static
         value (the format has no equivalent to `media`); it only matters
         for the moment before this script/the app has run. -->
    <meta name="theme-color" content="#c0392b" />
    <!-- Applies a saved "Clair"/"Sombre" choice (Paramètres > Thème) to
         <html data-theme> and to the theme-color meta above, before the
         rest of the page loads — so a donor who overrode their system's
         color scheme (or whose system is simply in dark mode) doesn't see
         a flash of the other theme/status-bar color while the Svelte app
         boots. App.svelte's reactive statements do the same thing
         afterwards, to react to later changes (a settings update, or a
         live system preference change while following "Système").
         "donorSettings" is the localStorage key `persisted()` uses in
         src/lib/settings/storage.ts, and '#c0392b'/'#e2574a' are
         --color-primary/--color-primary-night from App.svelte — all kept
         in sync manually since this script runs before any app code. -->
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BeBloody – Prochaine date de don de sang, plasma et plaquettes</title>
    <meta name="description" content="Suivi des dons de sang total, plasma et plaquettes, avec calcul de la prochaine date de don possible." />
    <link rel="canonical" href="https://bebloody.hautot.be/" />

    <!-- Link previews (WhatsApp, Messenger, Slack...). og:image must be an
         absolute URL; reuses the 512px app icon, square, hence the
         "summary" (not "summary_large_image") Twitter card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeBloody" />
    <meta property="og:title" content="BeBloody – Prochaine date de don de sang, plasma et plaquettes" />
    <meta property="og:description" content="Suivi des dons de sang total, plasma et plaquettes, avec calcul de la prochaine date de don possible." />
    <meta property="og:url" content="https://bebloody.hautot.be/" />
    <meta property="og:image" content="https://bebloody.hautot.be/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo BeBloody" />
    <meta property="og:locale" content="fr_BE" />
    <meta name="twitter:card" content="summary" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />

    <!-- iOS Safari ignores the web manifest for "add to home screen" behavior
         and icon, so it needs these set explicitly. Also served at this
         exact root path (not just referenced here) since iOS also probes
         /apple-touch-icon.png by convention, independently of this tag. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeBloody" />

    <!-- iOS also ignores the manifest for its "Add to Home Screen" launch
         screen (Android/Chrome synthesizes one from the manifest on its
         own) — without these, iOS just flashes plain white before the app's
         UI paints. One pair (portrait + landscape) per current iPhone
         screen size/pixel-ratio, each with a light and a dark variant (an
         extra `prefers-color-scheme: dark` clause on the same media query —
         iOS picks whichever currently-matching link, live, same mechanism
         as a plain CSS media query); `device-width`/`device-height` always
         use the portrait point values, `orientation` alone picks portrait
         vs landscape — see scripts/generate-splash.mjs, which renders these
         from the same mark as the app icon. This only follows the system's
         own appearance, never the in-app Système/Clair/Sombre override:
         the splash is drawn by iOS itself before the page (and its
         localStorage) has loaded. Older/discontinued screen sizes aren't
         covered and just keep the plain-white default, same as before this. -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-750-1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

  <body>
    <div id="app"></div>
    <!-- Static text for crawlers/visitors that don't run JavaScript: the
         whole UI is rendered by Svelte inside #app. -->
    <noscript>
      <h1>BeBloody</h1>
      <p>
        BeBloody vous aide à suivre vos dons de sang total, de plasma et de
        plaquettes, et calcule la prochaine date à laquelle vous pourrez
        donner à nouveau, selon les règles de votre pays (Belgique, France).
        Vos données restent dans votre navigateur, sans compte ni serveur.
      </p>
      <p>Activez JavaScript pour utiliser l'application.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
